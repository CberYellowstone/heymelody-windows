name: Windows packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (x.y.z); leave blank to use the project default.
        required: false
        type: string
      force_native_rebuild:
        description: Rebuild Filament instead of reusing the Windows native cache.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  package:
    name: Package (${{ matrix.architecture }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NuGet dependencies and the native Filament runtime use separate caches.
      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: artifacts/nuget-cache
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.targets', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Test cache and retention rules
        shell: pwsh
        run: ./tools/filament/tests/Test-FilamentArtifactCache.ps1 -OutputPath 'artifacts/filament-cache-checks/${{ matrix.architecture }}.json'
      # Reuse a verified runtime when available; otherwise compile it in this job.
      - name: Prepare Filament runtime
        id: filament
        uses: ./.github/actions/filament-runtime
        with:
          runtime-identifier: win-${{ matrix.architecture }}
          force-rebuild: ${{ inputs.force_native_rebuild || false }}
      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $default = Select-String -LiteralPath Build-Client.ps1 -Pattern "\[string\]\`$Version = '(\d+\.\d+\.\d+)'" | Select-Object -First 1
            if (-not $default) { throw 'Build-Client.ps1 has no default version.' }
            $version = $default.Matches[0].Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
          "commit=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT
      # ARM64 is cross-compiled on the x64 runner; native hardware execution is not implied.
      - name: Build application package
        shell: pwsh
        env:
          FILAMENT_RUNTIME_ROOT: ${{ steps.filament.outputs.runtime-root }}
        run: ./Build-Client.ps1 -Version '${{ steps.version.outputs.value }}' -Architectures '${{ matrix.architecture }}' -FilamentRuntimeRoot $env:FILAMENT_RUNTIME_ROOT -SkipTests
      - name: Verify package contents
        shell: pwsh
        run: ./tools/Verify-Release.ps1 -Version '${{ steps.version.outputs.value }}' -Architectures '${{ matrix.architecture }}' -OutputPath 'artifacts/filament-cache-checks/release-${{ matrix.architecture }}-static.json'
      # Push/manual runs publish packages: main keeps 7 days, other refs keep 1 day.
      - name: Upload application package
        if: steps.filament.outputs.package-publish-eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HeyMelody_Windows_${{ steps.version.outputs.value }}_${{ matrix.architecture }}_${{ steps.version.outputs.commit }}
          path: release/HeyMelody_Windows_${{ steps.version.outputs.value }}/
          if-no-files-found: error
          retention-days: ${{ steps.filament.outputs.package-retention-days }}
          overwrite: true
      # PRs still build and verify; check results from every event are kept for 1 day.
      - name: Upload verification results
        uses: actions/upload-artifact@v4
        with:
          name: windows-checks-${{ matrix.architecture }}-${{ steps.version.outputs.commit }}
          path: |
            artifacts/filament-cache-checks/release-${{ matrix.architecture }}-static.json
            artifacts/filament-cache-checks/${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: ${{ steps.filament.outputs.receipt-retention-days }}
          overwrite: true
      - name: Write package summary
        shell: pwsh
        env:
          HM_PUBLISH_PACKAGE: ${{ steps.filament.outputs.package-publish-eligible }}
          HM_PACKAGE_RETENTION: ${{ steps.filament.outputs.package-retention-days }}
        run: |
          if ($env:HM_PUBLISH_PACKAGE -eq 'true') {
            "Application artifact retention: $env:HM_PACKAGE_RETENTION day(s)." >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Pull request compilation and package verification completed; application packages are not published. Check receipts are retained for 1 day.' >> $env:GITHUB_STEP_SUMMARY
          }
